name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.91.0"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup default "${RUST_TOOLCHAIN}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Run Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings

      # The tests replay the committed bundles offline and make no RPC calls.
      - name: Run offline tests
        run: cargo test --locked --offline
